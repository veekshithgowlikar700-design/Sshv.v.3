name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          ls "$ANDROID_HOME" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:assembleDebug --stacktrace > build.log 2>&1
          STATUS=$?
          echo "Gradle exit code: $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "========== ERROR SUMMARY =========="
            grep -n -B2 -A12 -E "What went wrong|^e: |error:|FAILURE" build.log | head -120
          fi
          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SriSaiGanesh-Sewing-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
